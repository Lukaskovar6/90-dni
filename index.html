<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>90 dní – přežiješ zkušební dobu?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f4f1ea; --card:#fffdf8; --ink:#1d1b18; --muted:#6b655c; --line:#e3ddd1;
    --accent:#e2552b; --accent-soft:#fbe3d9;
    --energy:#2f9e6a; --trust:#3a6fd8; --links:#b5641c; --gold:#c69a1e;
    --radius:16px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;font-size:16px;line-height:1.5}
  h1,h2,h3{font-family:"Space Grotesk",Inter,sans-serif;line-height:1.15;margin:0}
  .wrap{max-width:560px;margin:0 auto;padding:16px 16px 40px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:0 1px 0 rgba(0,0,0,.03)}
  .stack>*+*{margin-top:14px}
  .muted{color:var(--muted)}
  .small{font-size:.86rem}
  .tag{display:inline-block;font-size:.72rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);background:var(--accent-soft);padding:3px 8px;border-radius:999px}
  button{font:inherit;cursor:pointer}
  .btn{display:block;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:14px 16px;color:var(--ink);transition:border-color .15s,transform .05s}
  .btn:hover{border-color:var(--ink)}
  .btn:active{transform:scale(.99)}
  .btn.primary{background:var(--ink);color:#fff;border-color:var(--ink);text-align:center;font-weight:600}
  .btn.primary:hover{background:#000}
  .btn.ghost{background:transparent;text-align:center;color:var(--muted);font-size:.9rem;border-style:dashed}
  .btn.ghost:hover{color:var(--accent);border-color:var(--accent)}
  .choices .btn+.btn{margin-top:10px}

  /* hero */
  .hero{padding:28px 22px}
  .hero h1{font-size:2.6rem;letter-spacing:-.02em}
  .hero h1 span{color:var(--accent)}
  .rules{padding-left:18px;margin:0}
  .rules li{margin:4px 0}

  /* ads */
  .ad{border:1.5px solid var(--line);border-radius:14px;padding:16px;background:var(--card);text-align:left;width:100%}
  .ad:hover{border-color:var(--ink)}
  .ad+.ad{margin-top:12px}
  .ad .firm{font-family:"Space Grotesk";font-weight:700;font-size:1.2rem}
  .ad ul{margin:8px 0 6px;padding-left:18px}
  .ad .ben{font-size:.85rem;color:var(--muted)}

  /* hud */
  .hud{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0 12px;margin-bottom:6px}
  .hudtop{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
  .week{font-family:"Space Grotesk";font-weight:700;font-size:1.1rem}
  .progress{height:4px;background:var(--line);border-radius:4px;overflow:hidden;margin-bottom:10px}
  .progress i{display:block;height:100%;background:var(--accent);transition:width .4s}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .stat{font-size:.74rem;font-weight:600;color:var(--muted)}
  .stat .bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:4px}
  .stat .bar i{display:block;height:100%;border-radius:6px;transition:width .5s}
  .bens{margin-top:8px;font-size:.78rem;color:var(--muted);display:flex;align-items:center;gap:6px}
  .bens b{color:var(--gold)}

  .promise{border-left:3px solid var(--accent);padding:6px 12px;background:var(--accent-soft);border-radius:0 10px 10px 0;font-size:.9rem}
  .promise b{display:block;font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--accent)}
  .scene h2{font-size:1.5rem}

  .deltas{display:flex;flex-wrap:wrap;gap:6px}
  .d{font-size:.8rem;font-weight:600;padding:3px 9px;border-radius:999px;background:#eee}
  .d.up{background:#dff3e9;color:#1d7a4f}
  .d.down{background:#fbe0dc;color:#b13a24}
  .concept{border:1.5px solid var(--ink);border-radius:14px;padding:14px 16px;background:#fff}
  .concept .name{font-family:"Space Grotesk";font-weight:700;font-size:1.05rem}
  .concept .src{font-size:.78rem;color:var(--muted)}

  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{font-size:.78rem;border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 10px}
  .big{font-family:"Space Grotesk";font-weight:700;font-size:1.9rem;letter-spacing:-.01em}
  .meter{display:grid;grid-template-columns:110px 1fr 36px;align-items:center;gap:8px;font-size:.85rem}
  .meter .bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden}
  .meter .bar i{display:block;height:100%;background:var(--ink)}
  .meter.win .bar i{background:var(--accent)}
  .q{background:var(--ink);color:#fff;border-radius:14px;padding:16px}
  .q b{color:#ffb79f}
  .fade{animation:fade .35s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  footer{text-align:center;font-size:.75rem;color:var(--muted);margin-top:24px}
  .echo{font-size:.85rem;font-weight:600;color:#5b3fb5;background:#ece6fb;border-radius:10px;padding:8px 12px}
  .teaser{font-size:.85rem;font-weight:600;color:#5b3fb5}
  .btn-echo{border-color:#b9a6ef;background:#f7f4ff}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn .lock{display:block;font-size:.75rem;color:var(--accent);font-weight:600;margin-top:2px}
  details.concept summary{cursor:pointer;list-style:none}
  details.concept summary::-webkit-details-marker{display:none}
  details.concept summary::after{content:" ▾";color:var(--muted)}
  .warn{font-size:.85rem;font-weight:600;color:#b13a24;background:#fbe0dc;border-radius:10px;padding:8px 12px}
  .dw{font-weight:400;opacity:.8}
  .plist{margin:0;padding-left:18px}
  .plist2,.why{margin:0;padding:0;list-style:none}
  .plist2 li,.why li{padding:6px 0;border-bottom:1px solid var(--line);font-size:.92rem}
  .plist2 li:last-child,.why li:last-child{border-bottom:0}
  .why li::before{content:"→ ";color:var(--accent);font-weight:700}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
/* ================= FIRMA ================= */
const FIRM = {
  name:"Lumen Digital", role:"Junior analytik/čka",
  promises:{
    onboard:"Propracovaný onboarding a buddy",
    flex:"Home office, kdy potřebuješ",
    balance:"Žádné přesčasy, work-life balance",
    family:"Rodinná atmosféra",
    growth:"Pravidelná zpětná vazba a růst"
  },
  benefits:"13. plat, 5 týdnů dovolené, MultiSport"
};

/* ================= TÝDNY =================
   choice: t, fx{e,d,v,b}, c{aff,calc,norm}, set[], p{promise:'kept'|'broken'},
           log:[tag,text], need (min. energie), needD (min. důvěra), res      */
const WEEKS = [
 // 1
 S => ({ p:"onboard", title:"První den",
   text:"Buddy je na dovolené. Notebook nemáš. Nikdo neví, kde budeš sedět.",
   choices:[
    {t:"Počkám, až si mě někdo všimne", fx:{d:-10}, p:{onboard:"broken"}, set:["passive"], log:["trust","1. týden: první den jsi čekal(a), až si tě někdo všimne."], res:"Do oběda si tě nikdo nevšimne."},
    {t:"Zeptám se kolegy vedle", fx:{v:15}, p:{onboard:"broken"}, set:["tomas"], log:["links","1. týden: oslovil(a) jsi Tomáše a získal(a) spojence."], res:"Kolega Tomáš ti půjčí notebook. Máš spojence."},
    {t:"Napíšu na HR", fx:{d:-5,b:-1}, p:{onboard:"broken"}, set:["hr"], log:["voice","1. týden: ozval(a) ses na HR."], res:"HR: „Buddy program teď nefunguje.“ Šéf to ví."}
   ],
   concept:["Buddy jen na papíře","Buddy zrychluje adaptaci. Bez času na nováčka nefunguje.","Bauer et al., 2007"] }),

 // 2
 S => {
   const ch = [
    {t:"Udělám všechno, i večer", fx:{e:-15,b:1}, c:{norm:1}, set:["workhorse"], need:15, log:["work","2. týden: zvládl(a) jsi všechny úkoly – po večerech."], res:"Stihneš to. Do půlnoci."},
    {t:"Zeptám se šéfa na priority", fx:{d:-5,b:1}, log:["boss","2. týden: zeptal(a) ses šéfa na priority."], res:"Šéf: „To se časem naučíš.“ Ale líbí se mu, že se ptáš."},
    {t:"Vyberu si sám(a)", fx:{v:-10,b:-1}, log:["boss","2. týden: rozhodl(a) ses sám/sama, kolegové se urazili."], res:"Dva kolegové i šéf jsou naštvaní."}
   ];
   if(S.f.tomas) ch.push({t:"Zeptám se Tomáše", fx:{v:5}, set:["rules"], echo:1, log:["links","2. týden: Tomáš ti vysvětlil nepsaná pravidla."], res:"Tomáš ti prozradí nepsaná pravidla."});
   return { p:"onboard", title:"Tři lidé, tři úkoly",
     text:"Každý tvrdí, že ten jeho je nejdůležitější. Popis pozice nesedí ani na jeden.",
     echo: S.f.tomas ? "Tomáš z 1. týdne ti může poradit." : null, choices:ch,
     concept:["Srozumitelnost role","Nejasná role je jeden z nejsilnějších stresorů.","Bauer et al., 2007"] };
 },

 // 3
 S => {
   const wh = S.f.workhorse;
   const ch = [
    {t:"Odpovím hned", fx:{e:-10,b:1}, c:{norm:1}, set:["alwayson"], p:{balance:"broken"}, log:["work","3. týden: začal(a) jsi odpovídat na maily i večer."], res:"Šéf je spokojený. Večery už nejsou tvoje."},
    {t:"Odpovím ráno", fx:{e:5,d:-5,b: wh?-2:-1}, set:["boundary"], log:["boss","3. týden: nastavil(a) sis hranici – maily až ráno."], res: wh ? "Šéf: „Minulý týden jsi byl(a) rychlejší.“" : "Pochvalu dostane někdo jiný."}
   ];
   ch.push(S.f.rules
     ? {t:"Tomáš mě varoval – odpovím krátce a dost", fx:{v:5}, echo:1, log:["links","3. týden: díky Tomášovi jsi věděl(a), co se čeká."], res:"Krátká odpověď stačí. Šéf je ok, ty taky."}
     : {t:"Zeptám se kolegů, jestli se to čeká", fx:{d:-10,v:10}, set:["truth"], log:["trust","3. týden: kolegové ti řekli, jak to tu reálně chodí."], res:"„Oficiálně ne. Reálně jo.“"});
   return { p:"balance", title:"E-mail ve 21:47",
     text: wh ? "Šéf píše večer – rovnou tobě. Ví, že večer pracuješ." : "Šéf píše večer. Kdo odpoví hned, dostane pochvalu.",
     echo: wh ? "Ve 2. týdnu jsi pracoval(a) večer. Šéf si to pamatuje." : (S.f.rules ? "Tomáš ti o tomhle říkal." : null),
     choices: ch,
     concept:["Hodnoty vs. realita","Kulturu neukazuje inzerát, ale to, co šéf odměňuje.","Schein & Schein, 2016"] };
 },

 // 4
 S => {
   const fav = S.b >= 2;
   const ch = [
    {t:"Dobře, beru", fx:{d:-10}, p:{flex:"broken"}, log:["trust","4. týden: smířil(a) ses se zákazem home office."], res:"Kývneš. Tohle ale na pohovoru nezaznělo."},
    {t:"Ukážu mu inzerát", fx:{d:-5,b:-2}, p:{flex:"broken"}, set:["rebel"], log:["boss","4. týden: ukázal(a) jsi šéfovi inzerát. Nelíbilo se mu to."], res:"„Tak jsme to nemysleli.“ Šéf je uražený."}
   ];
   ch.push(fav
     ? {t:"Požádám o výjimku", fx:{e:10}, p:{flex:"kept"}, set:["favorite"], echo:1, log:["boss","4. týden: šéf ti dal výjimku – máš u něj dobré jméno."], res:"„Pro tebe jo, jeden den v týdnu.“ Konečně si odpočineš."}
     : {t:"Asi to nemyslí zle", fx:{d:-3}, p:{flex:"broken"}, res:"Zklamání je menší."});
   return { p:"flex", title:"Home office? Ne.",
     text:"Šéf: „Nováčci jsou první půlrok v kanceláři. Ať tě vidím.“",
     echo: fav ? "Šéf tě má rád – zkus to využít." : null, choices:ch,
     concept:["Nenaplnění vs. porušení","Slib neplatí = nenaplnění. Pocit podvodu = porušení.","Morrison & Robinson, 1997"] };
 },

 // 5
 S => {
   if(S.v < 20) return { p:"family", title:"Oběd bez tebe",
     text:"Tým jde na oběd. Tebe nikdo nepozval.",
     echo:"Máš málo vazeb – nikdo si na tebe nevzpomněl.",
     choices:[
      {t:"Přidám se sám(a)", fx:{v:10}, log:["links","5. týden: na oběd jsi se pozval(a) sám/sama."], res:"Trochu trapné. Ale funguje to."},
      {t:"Zůstanu u stolu", fx:{e:-5,v:-5,d:-5}, p:{family:"broken"}, set:["lonely"], log:["links","5. týden: zůstal(a) jsi na obědě sám/sama."], res:"Na fotkách z oběda nejsi."}
     ],
     concept:["Vazby","Vztahy s kolegy drží lidi ve firmě.","Mitchell et al., 2001"] };
   return { p:"family", title:"Týmový oběd",
     text:"Tým jde v pátek na oběd. Ty máš práci do večera.",
     choices:[
      {t:"Jdu s nimi", fx:{e:10,v:15}, c:{aff:1}, p:{family:"kept"}, log:["links","5. týden: šel/šla jsi s týmem na oběd."], res:"Poprvé se smějete. Nejsi „ten nový“."},
      {t:"Dodělám práci", fx:{e:-5,v:-10,b:1}, p:{family:"broken"}, log:["work","5. týden: místo oběda s týmem jsi pracoval(a)."], res:"Šéf má práci včas. Tým tě nevidí."},
      {t:"Jdu a zeptám se, jak se tu mají", fx:{v:10,d:-10}, set:["truth"], log:["trust","5. týden: kolegové ti řekli pravdu o firmě."], res:"„Ty sliby z inzerátu? Ty psal marketing.“"}
     ],
     concept:["Vazby","Vztahy s kolegy drží lidi ve firmě.","Mitchell et al., 2001"] };
 },

 // 6
 S => {
   const reb = S.f.rebel;
   const ch = [
    reb
     ? {t:"Trvám na schůzce", fx:{d:-5,b:-1}, p:{growth:"broken"}, echo:1, log:["boss","6. týden: šéf tě odbyl – pamatuje si inzerát."], res:"„Ty pořád něco chceš.“"}
     : {t:"Trvám na schůzce", fx:{e:5,d:5,b:1}, p:{growth:"kept"}, log:["trust","6. týden: vyžádal(a) sis zpětnou vazbu a dostal(a) ji."], res:"15 minut. Konečně víš, co zlepšit."},
    {t:"Nechám to být", fx:{e:-5,d:-10}, p:{growth:"broken"}, set:["insecure"], log:["trust","6. týden: zpětnou vazbu jsi nedostal(a) a nejistota rostla."], res:"Nevíš, jestli tě po zkušebce nevyhodí."}
   ];
   ch.push(S.f.tomas
     ? {t:"Zeptám se Tomáše", fx:{e:5,v:10}, echo:1, log:["links","6. týden: zpětnou vazbu ti dal Tomáš místo šéfa."], res:"Tomáš ti dá upřímnou zpětnou vazbu."}
     : {t:"Zeptám se kolegy", fx:{v:5}, res:"Pár rad dostaneš."});
   return { p:"growth", title:"Zpětná vazba? Později.",
     text:"Šéf zruší hodnoticí schůzku: „Je to dobrý.“",
     echo: reb ? "Ve 4. týdnu jsi šéfovi ukázal(a) inzerát. Pamatuje si to." : null, choices:ch,
     concept:["Sebedůvěra","Bez zpětné vazby nováček neví, jestli práci zvládá.","Bauer et al., 2007"] };
 },

 // 7
 S => ({ p:"benefit", title:"„Vydrž do konce zkušebky“",
   text:`HR připomíná: po zkušebce dostaneš ${FIRM.benefits}.`,
   echo: S.d < 40 ? "Firmě už moc nevěříš. Benefity jsou teď hodně lákavé." : null,
   choices:[
    {t:"To se vyplatí vydržet", c:{calc:2}, set:["golden"], log:["calc","7. týden: rozhodl(a) ses vydržet kvůli benefitům."], res:"Najednou máš co ztratit."},
    {t:"Kvůli tomu tu nejsem", c:{aff:1}, log:["aff","7. týden: benefity pro tebe nebyly hlavní důvod."], res:"Benefity bereš jako bonus."},
    {t:"Spočítám, o co bych přišel(a)", c:{calc:1}, set:["golden"], log:["calc","7. týden: spočítal(a) sis, o kolik bys odchodem přišel(a)."], res:"Pěkné číslo. Myslíš na něj pořád."}
   ],
   concept:["Benefity nemotivují","Benefity snižují nespokojenost, ale spokojenost nevytvoří.","Herzberg et al., 1959"] }),

 // 8
 S => {
   if(S.f.workhorse || S.f.alwayson) return { p:"balance", title:"Víkend? Tvůj.",
     text:"Pátek 16:00. Šéf: „Prezentaci na pondělí vezmeš ty, ne?“",
     echo:"Naučil(a) jsi šéfa, že jsi vždycky k dispozici.",
     choices:[
      {t:"Vezmu to", fx:{e:-20,b:1}, c:{norm:1}, need:20, p:{balance:"broken"}, log:["work","8. týden: obětoval(a) jsi víkend – zase."], res:"Pondělí zvládnuté. Ty jsi prázdný(á)."},
      {t:"Tentokrát ne", fx:{e:5,d:-5,b:-2}, log:["boss","8. týden: poprvé jsi šéfovi řekl(a) ne. Byl naštvaný."], res:"Šéf je překvapený. A naštvaný."}
     ],
     concept:["Model JD-R","Hodně požadavků + málo zdrojů = vyčerpání.","Maslach et al., 2001"] };
   return { p:"balance", title:"Víkendová krize",
     text:"Pátek 16:00. Klient chce prezentaci na pondělí.",
     choices:[
      {t:"Beru to", fx:{e:-20,v:5,b:2}, c:{norm:1}, need:20, set:["workhorse"], p:{balance:"broken"}, log:["work","8. týden: vzal(a) jsi víkendovou práci."], res:"Zvládnuto. Za cenu celého víkendu."},
      {t:"Odmítnu", fx:{e:5,d:-5,b:-1}, log:["boss","8. týden: víkendovou práci jsi odmítl(a)."], res:"Šéf jen řekne „dobře“. Tím tónem."},
      {t:"Vezmu, ale chci volno", fx:{e:-10,b:1}, need:10, set:["owed"], p:{balance:"broken"}, log:["work","8. týden: za víkend ti slíbili volno."], res:"Volno ti slíbí. „Až bude klid.“"}
     ],
     concept:["Model JD-R","Hodně požadavků + málo zdrojů = vyčerpání.","Maslach et al., 2001"] };
 },

 // 9
 S => {
   const g = S.f.golden;
   return { p:"benefit", title:"Nabídka odjinud",
     text:"Kamarád nabízí místo jinde. Menší plat, ale upřímně ti řekl i nevýhody.",
     echo: g ? "Benefity jsou za 3 týdny. Těžko se od nich odchází." : null,
     choices:[
      {t: g ? "Ne, benefity jsou za rohem" : "Ne, už jsem tu dva měsíce", c:{calc:2}, set:["sunk"], log:["calc","9. týden: odmítl(a) jsi nabídku kvůli tomu, co už jsi investoval(a)."], res:"Škoda odejít. Ale škoda čeho?"},
      {t:"Půjdu na pohovor", fx:{e:-5}, c:{aff:-1}, set:["offer"], log:["exit","9. týden: šel/šla jsi na pohovor jinam a máš nabídku."], res:"Pohovor byl upřímný. Máš nabídku v šuplíku."},
      {t:"Ne, baví mě to tu", fx:{e:5}, c:{aff:2}, needD:45, log:["aff","9. týden: nabídku jsi odmítl(a), protože tě to tu baví."], res:"Nejzdravější důvod zůstat."}
     ],
     concept:["Utopené náklady","Zůstáváme kvůli tomu, co jsme už investovali.","Arkes & Blumer, 1985"] };
 },

 // 10
 S => {
   const t = S.f.tomas, who = t ? "Tomáš" : "Kolegyně Jana";
   const ch = [
    {t:"Rozloučím se, zůstávám", fx:{d:-5,v: t?-20:-5}, log:["links", t?"10. týden: odešel Tomáš – tvůj jediný spojenec.":"10. týden: odešla Jana."], res: t ? "Bez Tomáše je to tu prázdné." : "Je tu o jednoho člověka míň."},
    {t:"Zeptám se proč", fx:{d:-10}, set: t?["tomasOffer"]:["truth"], log: t?["exit","10. týden: Tomáš ti nabídl místo ve své nové firmě."]:["trust","10. týden: Jana ti potvrdila, že nejsi jediný/á."], res: t ? "Tomáš: „Pojď se mnou. Hledají lidi.“" : "Popíše přesně to, co zažíváš ty."},
    {t:"Nemůžu nechat tým ve štychu", fx:{e:-5}, c:{norm:2}, log:["norm","10. týden: zůstal(a) jsi z povinnosti k týmu."], res:"Povinnost. Nebo tlak?"}
   ];
   if(S.f.truth || S.f.hr) ch.push({t:"Navrhnu HR rozhovory s odcházejícími", fx:{e:-5,b:-1}, c:{aff:1}, set:["voice"], echo:1, log:["voice","10. týden: navrhl(a) jsi HR, ať se ptá odcházejících proč."], res:"HR souhlasí. Šéf se tváří kysele."});
   return { p:"family", title:`${t?"Tomáš":"Jana"} odchází`,
     text:`${who} dává výpověď ve zkušebce. „Tady se nic nezmění.“`,
     echo: t ? "Tvůj spojenec z 1. týdne odchází." : (S.f.truth||S.f.hr ? "Víš, jak to tu chodí. Můžeš s tím něco dělat." : null),
     choices: ch, after: S => { S.f.tomasGone = true; },
     concept:["Porušení je norma","Asi 55 % lidí zažije porušení slibů do 2 let.","Robinson & Rousseau, 1994"] };
 },

 // 11
 S => {
   const ch = [
    {t:"Věřím mu", fx:{d:10}, c:{aff:1}, set:["believe"], log:["aff","11. týden: uvěřil(a) jsi šéfovu slibu."], res:"Vrací se ti nadšení."},
    {t:"Slibovat nic nestojí", fx:{d:-5}, set:["cynic"], log:["cynic","11. týden: šéfovi už nevěříš ani slovo."], res:"Možná máš pravdu. Možná jsi už cynik."},
    {t:"Chci to písemně, s termínem", fx:{d:5}, set:["written"], log:["voice","11. týden: chtěl(a) jsi slib písemně."], res:"Šéf to rozešle mailem i s termínem."}
   ];
   if(S.f.voice) ch.push({t:"Nabídnu, že nový onboarding pomůžu udělat", fx:{e:-10,b:2}, c:{aff:2}, set:["changeAgent"], need:10, echo:1, log:["voice","11. týden: nabídl(a) ses, že pomůžeš změnit onboarding."], res:"Šéf překvapeně kývne. Máš projekt."});
   return { p:"flex", title:"„Od ledna bude líp“",
     text:"Šéf slibuje: od ledna home office a nový onboarding.",
     echo: S.f.voice ? "Tvůj návrh z 10. týdne se dostal až k vedení." : null, choices:ch,
     concept:["Levné vs. drahé signály","Sliby nic nestojí. Věrohodné jsou konkrétní kroky.","Bangerter et al., 2012"] };
 },

 // 12
 S => {
   const ch = [
    {t:"Zůstávám", end:"stay"},
    {t:"Zůstanu, ale budu dělat jen minimum", end:"quiet"},
    {t:"Odcházím", end:"leave"}
   ];
   if(S.f.offer) ch.push({t:"Beru nabídku od kamaráda", end:"offer", echo:1});
   if(S.f.tomasOffer) ch.push({t:"Jdu za Tomášem", end:"tomas", echo:1});
   const ech = [S.f.offer && "nabídku z 9. týdne", S.f.tomasOffer && "Tomášovu nabídku"].filter(Boolean);
   return { p:"benefit", title:"Poslední den zkušebky",
     text:`Zítra naskočí benefity. Pak už odchod nebude tak snadný.`,
     echo: ech.length ? "Máš v šuplíku " + ech.join(" a ") + "." : null,
     choices: ch,
     concept:["Zkušební doba","Obě strany si ověřují, jestli to sedí. Odejít jde i bez důvodu.","§ 35 zákoníku práce"] };
 }
];

/* ================= KONCE ================= */
const ENDINGS = {
  sacrifice:{ic:"🪫", t:"Obětoval(a) ses", s:"Bral(a) jsi všechno – večery i víkendy. Energie došla dřív než zkušebka.", tags:["work"], th:"JD-R: vysoké požadavky bez zdrojů vedou k vyčerpání."},
  empty:{ic:"🪫", t:"Došla ti energie", s:"Nebylo z čeho brát. Ne vyhoření – na to jsi tu krátce – ale vyčerpání a deziluze.", tags:["links","trust"], th:"JD-R: chyběly zdroje – kolegové, podpora, odpočinek."},
  fired:{ic:"✂️", t:"Neprošel(a) jsi zkušebkou", s:"Šéf ukončil pracovní poměr. Zkušebka platí pro obě strany.", tags:["boss"], th:"P–O fit: firma si ověřuje, jestli zapadáš do její (skutečné) kultury."},
  runEarly:{ic:"🏃", t:"Útěk v prvních týdnech", s:"Šok z reality přišel rychle a ty jsi neváhal(a).", tags:["trust","links"], th:"Reality shock: realita se od inzerátu lišila hned od začátku."},
  runMid:{ic:"🚪", t:"Odchod v půlce zkušebky", s:"Viděl(a) jsi dost. Zkušebku jsi využil(a) přesně k tomu, k čemu je.", tags:["trust","boss","links"], th:"Porušení psychologické smlouvy vede k odchodu."},
  leave:{ic:"🚪", t:"Odchod těsně před benefity", s:"Benefity byly na dosah, a stejně jsi odešel/odešla.", tags:["calc","trust"], th:"Utopené náklady tě nezastavily."},
  offer:{ic:"🌱", t:"Nový start", s:"Jdeš tam, kde ti ukázali i nevýhody práce.", tags:["exit","trust"], th:"Realistický náhled na práci (RJP) je věrohodnější slib."},
  tomas:{ic:"🤝", t:"Za Tomášem", s:"Vazba s kolegou byla silnější než firma.", tags:["links","exit"], th:"Job embeddedness: vazby drží – i když se stěhují jinam."},
  quiet:{ic:"😶", t:"Tichý odchod", s:"Zůstáváš, ale jen tělem. Děláš minimum.", tags:["cynic","trust","calc"], th:"Cynismus a odstup – druhá dimenze podle Maslachové."},
  change:{ic:"📣", t:"Hlas změny", s:"Místo odchodu měníš firmu zevnitř. Nový onboarding je tvůj projekt.", tags:["voice"], th:"Nováček, který vidí rozdíl slibů a reality, ho umí pojmenovat nejlíp."},
  favorite:{ic:"🏆", t:"Šéfův oblíbenec", s:"Šéf tě miluje a čeká povýšení. Za cenu večerů a víkendů.", tags:["work","boss"], th:"Odměňuje se dostupnost – skutečná hodnota, ne ta z inzerátu (Schein)."},
  happy:{ic:"💚", t:"Spokojený nováček", s:"Zůstáváš, protože chceš. Lidi tě drží víc než benefity.", tags:["aff","links"], th:"Afektivní závazek – jediný, který dlouhodobě funguje."},
  golden:{ic:"⛓️", t:"Zlatá pouta", s:"Drží tě benefity a investovaný čas, ne firma.", tags:["calc"], th:"Kalkulativní závazek – benefity jako psychologická past."},
  duty:{ic:"🏋️", t:"Tahoun týmu", s:"Zůstáváš z povinnosti. Bez tebe by to tým nedal – myslíš si.", tags:["norm","work"], th:"Normativní závazek – povinnost spokojenost nepřinese."}
};
const ENDING_IDS = Object.keys(ENDINGS);

const LABELS = { e:"Energie", d:"Důvěra", v:"Vazby" };
const PNAMES = FIRM.promises;

/* ================= STAV ================= */
let S, cur;
function reset(){ S = { i:0, e:70, d:70, v:10, b:0, aff:0, calc:0, norm:0, f:{}, log:[], prom:{}, concepts:[] }; }
const clamp = x => Math.max(0, Math.min(100, x));
const $app = document.getElementById("app");
function render(html){ $app.innerHTML = `<div class="fade">${html}</div><footer>3PS212 Organizační chování · VŠE</footer>`; window.scrollTo(0,0); }

function found(){ try{ return JSON.parse(localStorage.getItem("90dni-konce")||"[]"); }catch(e){ return []; } }
function saveFound(id){ try{ const f=found(); if(!f.includes(id)){ f.push(id); localStorage.setItem("90dni-konce", JSON.stringify(f)); } }catch(e){} }

/* týdenní zátěž podle JD-R: požadavky ubírají, vazby a šéf jsou zdroje */
function weeklyDrain(){
  let x = 3, why = [];
  if(S.f.alwayson){ x += 2; why.push("maily večer"); }
  if(S.f.workhorse){ x += 2; why.push("práce navíc"); }
  if(S.f.insecure){ x += 2; why.push("nejistota"); }
  if(S.f.lonely){ x += 2; why.push("samota"); }
  if(S.v >= 40){ x -= 2; why.push("kolegové pomáhají"); }
  if(S.f.favorite){ x -= 2; why.push("home office"); }
  return { x: Math.max(1,x), why };
}
const bossFace = () => S.b >= 3 ? "😀" : S.b >= 1 ? "🙂" : S.b > -2 ? "😐" : S.b > -4 ? "😠" : "🤬";

/* ================= OBRAZOVKY ================= */
function intro(){
  reset();
  const n = found().length;
  render(`
  <div class="card hero stack">
    <span class="tag">Hra k prezentaci</span>
    <h1>90 <span>dní</span></h1>
    <p style="font-size:1.1rem;margin:4px 0 0">Přežiješ zkušební dobu?</p>
    <p class="muted" style="margin:0">12 týdnů, 12 rozhodnutí. Firma si je pamatuje. ${ENDING_IDS.length} možných konců.</p>
    ${n ? `<p class="small" style="margin:0">Objevené konce: <b>${n} / ${ENDING_IDS.length}</b></p>` : ""}
    <button class="btn primary" onclick="adScreen()">Začít →</button>
  </div>`);
}

function adScreen(){
  render(`
  <div class="card stack">
    <span class="tag">Inzerát</span>
    <div><h2>${FIRM.name}</h2><div class="muted">hledá: ${FIRM.role}</div></div>
    <ul class="plist">${Object.values(PNAMES).map(p=>`<li>${p}</li>`).join("")}</ul>
    <div class="ben">🎁 Po zkušební době: ${FIRM.benefits}</div>
    <p class="small muted" style="margin:0">Tohle jsou sliby, se kterými nastupuješ. Uvidíme, kolik jich platí.</p>
    <button class="btn primary" onclick="startGame()">Nastoupit →</button>
  </div>`);
}
function startGame(){ addConcept("Psychologická smlouva"); scene(); }
function addConcept(n){ if(!S.concepts.includes(n)) S.concepts.push(n); }

function hud(shown){
  const bar = (k,col) => `<div class="stat">${LABELS[k]}<div class="bar"><i style="width:${S[k]}%;background:${col}"></i></div></div>`;
  const dr = weeklyDrain();
  return `
  <div class="hud">
    <div class="hudtop"><div class="week">Týden ${shown} / 12</div><div class="small">Šéf ${bossFace()}</div></div>
    <div class="progress"><i style="width:${(S.i/12)*100}%"></i></div>
    <div class="stats">${bar("e","var(--energy)")}${bar("d","var(--trust)")}${bar("v","var(--links)")}</div>
    <div class="bens">⚡ Práce ti každý týden ubere <b style="color:var(--accent)">−${dr.x}</b> energie</div>
  </div>`;
}

function scene(){
  cur = WEEKS[S.i](S);
  const promise = cur.p==="benefit"
      ? `<div class="promise"><b>Inzerát</b>🎁 ${FIRM.benefits}</div>`
      : `<div class="promise"><b>Inzerát slíbil</b>${PNAMES[cur.p]}</div>`;
  render(`${hud(S.i+1)}
  <div class="card scene stack">
    ${promise}
    ${cur.echo ? `<div class="echo">🔁 ${cur.echo}</div>` : ""}
    <h2>${cur.title}</h2>
    <p style="margin:0">${cur.text}</p>
    <div class="choices">
      ${cur.choices.map((c,j)=>{
        const tired = c.need && S.e < c.need;
        const doubt = c.needD && S.d < c.needD;
        const lock = tired ? "Nemáš na to sílu" : doubt ? "Tomu sám/sama nevěříš" : "";
        return `<button class="btn ${c.echo?'btn-echo':''}" ${lock?'disabled':''} onclick="choose(${j})">${c.t}${lock?`<span class="lock">${lock}</span>`:''}</button>`;
      }).join("")}
    </div>
  </div>
  ${S.i < 11 ? `<div style="margin-top:14px"><button class="btn ghost" onclick="quitConfirm()">Dát výpověď hned</button></div>` : ""}`);
}

function choose(j){
  const c = cur.choices[j], week = S.i+1;
  addConcept(cur.concept[0]);
  if(c.end){ S.i++; return finish(c.end); }

  const deltas = [];
  const fx = c.fx || {};
  for(const k of ["e","d","v"]){
    const dv = fx[k]||0;
    if(dv){ S[k] = clamp(S[k]+dv); deltas.push(`<span class="d ${dv>0?'up':'down'}">${LABELS[k]} ${dv>0?'+':'−'}${Math.abs(dv)}</span>`); }
  }
  if(fx.b){ S.b += fx.b; deltas.push(`<span class="d ${fx.b>0?'up':'down'}">Šéf ${fx.b>0?'👍':'👎'}</span>`); }
  if(c.c) for(const k in c.c) S[k] += c.c[k];
  if(c.p) Object.assign(S.prom, c.p);
  const newFlag = (c.set||[]).some(f => !S.f[f]);
  (c.set||[]).forEach(f => S.f[f] = true);
  if(c.log) S.log.push(c.log);
  if(cur.after) cur.after(S);

  // týdenní zátěž
  const dr = weeklyDrain();
  S.e = clamp(S.e - dr.x);
  deltas.push(`<span class="d down">Týden v práci −${dr.x}${dr.why.length?` <span class="dw">(${dr.why.join(", ")})</span>`:""}</span>`);
  S.i++;

  let next = `<button class="btn primary" onclick="scene()">Týden ${S.i+1} →</button>`;
  if(S.e <= 0) next = `<button class="btn primary" onclick="finish('energy')">Dál →</button>`;
  else if(S.b <= -4 && week >= 6) next = `<button class="btn primary" onclick="finish('fired')">Šéf si tě volá… →</button>`;

  render(`${hud(week)}
  <div class="card stack">
    <p style="margin:0;font-size:1.15rem;font-weight:500">${c.res}</p>
    <div class="deltas">${deltas.join("")}</div>
    ${newFlag ? `<div class="teaser">🔁 Tohle se ti ještě vrátí.</div>` : ""}
    ${S.e>0 && S.e < 20 ? `<div class="warn">⚠️ Jsi na dně. Další týden to nemusíš dát.</div>` : ""}
    <details class="concept">
      <summary><span class="name">💡 ${cur.concept[0]}</span></summary>
      <p class="small" style="margin:6px 0 2px">${cur.concept[1]}</p>
      <div class="src">${cur.concept[2]}</div>
    </details>
    ${next}
  </div>`);
}

function quitConfirm(){
  render(`${hud(S.i+1)}
  <div class="card stack">
    <h2>Opravdu odejít?</h2>
    <p style="margin:0">Ve zkušebce můžeš odejít kdykoli i bez důvodu. Benefity ale propadnou.</p>
    <button class="btn primary" onclick="finish('quit')">Odcházím</button>
    <button class="btn" style="text-align:center" onclick="scene()">Ještě vydržím</button>
  </div>`);
}

/* ================= VYHODNOCENÍ ================= */
function commit(){
  const aff = Math.max(0, S.aff*1.5 + (S.d + S.v - 80)/25);
  const calc = Math.max(0, S.calc*1.5 + S.i/6);
  const norm = Math.max(0, S.norm*1.5);
  const tot = aff+calc+norm || 1;
  return { aff:Math.round(aff/tot*100), calc:Math.round(calc/tot*100), norm:Math.round(norm/tot*100) };
}

function pickEnding(kind){
  if(kind==="energy") return (S.f.workhorse || S.f.alwayson) ? "sacrifice" : "empty";
  if(kind==="fired") return "fired";
  if(kind==="quit") return S.i <= 5 ? "runEarly" : "runMid";
  if(kind==="leave") return "leave";
  if(kind==="offer") return "offer";
  if(kind==="tomas") return "tomas";
  if(kind==="quiet") return "quiet";
  // zůstává
  if(S.f.changeAgent) return "change";
  if(S.b >= 4 && (S.f.workhorse || S.f.alwayson)) return "favorite";
  const c = commit();
  const top = Object.keys(c).sort((a,b)=>c[b]-c[a])[0];
  if(top==="aff") return S.d >= 45 ? "happy" : "golden";
  return top==="calc" ? "golden" : "duty";
}

function finish(kind){
  const id = pickEnding(kind), E = ENDINGS[id];
  saveFound(id);
  const all = found();

  // proč se to stalo – záznamy hráčových rozhodnutí, které k danému konci vedly
  let why = S.log.filter(l => E.tags.includes(l[0])).map(l=>l[1]);
  if(why.length < 2) why = why.concat(S.log.filter(l => !E.tags.includes(l[0])).map(l=>l[1]).slice(-2+why.length));
  why = why.slice(-3);

  // epilog
  let epi = "";
  if(["happy","golden","duty","favorite","quiet","change"].includes(id)){
    if(S.f.changeAgent) epi = "📅 Leden: nový onboarding je venku. Další nováček má buddyho, který má čas.";
    else if(S.f.written) epi = "📅 Leden: home office opravdu přišel. Písemný závazek zafungoval.";
    else if(S.f.believe) epi = "📅 Leden: home office nepřišel. Další nenaplněný slib.";
    else epi = "📅 Leden: nic se nezměnilo.";
  }

  const kept = Object.keys(PNAMES).filter(k=>S.prom[k]==="kept").length;
  const plist = Object.keys(PNAMES).map(k=>{
    const st = S.prom[k]; const ic = st==="kept"?"✅":st==="broken"?"❌":"➖";
    return `<li><span>${ic}</span> ${PNAMES[k]}</li>`;
  }).join("");

  const c = commit();
  const meter = k => `<div class="meter"><span>${{aff:"Afektivní",calc:"Kalkulativní",norm:"Normativní"}[k]}</span><div class="bar"><i style="width:${c[k]}%"></i></div><b>${c[k]}%</b></div>`;

  render(`<div class="stack">
    <div class="card stack" style="text-align:center">
      <div style="font-size:3rem;line-height:1">${E.ic}</div>
      <div class="big">${E.t}</div>
      <p style="margin:0" class="muted">${E.s}</p>
      <div class="small">Konec ${ENDING_IDS.indexOf(id)+1} z ${ENDING_IDS.length} · objeveno <b>${all.length}</b></div>
    </div>

    <div class="card stack">
      <h3>Proč se to stalo</h3>
      <ul class="why">${why.map(w=>`<li>${w}</li>`).join("")}</ul>
      <p class="small" style="margin:0"><b>💡 Teorie:</b> ${E.th}</p>
      ${epi ? `<p style="margin:0">${epi}</p>` : ""}
    </div>

    <div class="card stack">
      <h3>Sliby z inzerátu: ${kept} z 5 dodrženo</h3>
      <ul class="plist2">${plist}</ul>
    </div>

    <div class="card stack">
      <h3>Co tě drželo</h3>
      ${meter("aff")}${meter("calc")}${meter("norm")}
      <div class="small muted">Meyer & Allen, 1991</div>
    </div>

    <div class="q"><b>Do diskuse:</b> Zažil(a) jsi to někdy na brigádě? Co tě drželo?</div>
    <button class="btn primary" onclick="intro()">Hrát znovu – najdi jiný konec</button>
  </div>`);
}

intro();
</script>
</body>
</html>
