<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>90 dní – přežiješ zkušební dobu?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f4f1ea; --card:#fffdf8; --ink:#1d1b18; --muted:#6b655c; --line:#e3ddd1;

  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;font-size:16px;line-height:1.5}
  h1,h2,h3{font-family:"Space Grotesk",Inter,sans-serif;line-height:1.15;margin:0}
  .wrap{max-width:560px;margin:0 auto;padding:16px 16px 40px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px}
  .stack>*+*{margin-top:14px}
  .muted{color:var(--muted)} .small{font-size:.86rem}
  .tag{display:inline-block;font-size:.72rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);background:var(--accent-soft);padding:3px 8px;border-radius:999px}
  button{font:inherit;cursor:pointer}
  .btn{display:block;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:14px 16px;color:var(--ink);transition:border-color .15s,transform .08s}
  .btn:hover:not(:disabled){border-color:var(--ink)}
  .btn:active:not(:disabled){transform:scale(.98)}
  .btn.primary{background:var(--ink);color:#fff;border-color:var(--ink);text-align:center;font-weight:600}
  .btn.ghost{background:transparent;text-align:center;color:var(--muted);font-size:.9rem;border-style:dashed}
  .btn.ghost:hover{color:var(--accent);border-color:var(--accent)}
  .btn-echo{border-color:#b9a6ef;background:#f7f4ff}
  .btn.locked{opacity:.55;cursor:not-allowed;border-style:dashed;padding:10px 14px;font-size:.9rem;background:transparent}
  .btn .lock{display:block;font-size:.76rem;color:var(--violet);font-weight:600;margin-top:2px}
  .btn.tired .lock{color:var(--accent)}
  .choices .btn+.btn{margin-top:10px}

  .hero{padding:28px 22px}
  .hero h1{font-size:2.8rem;letter-spacing:-.02em}
  .hero h1 span{color:var(--accent)}

  .ad{border:1.5px solid var(--line);border-radius:14px;padding:16px;background:var(--card);text-align:left;width:100%;display:block}
  .ad:hover{border-color:var(--ink)}
  .ad+.ad{margin-top:12px}
  .ad .firm{font-family:"Space Grotesk";font-weight:700;font-size:1.25rem}
  .ad ul{margin:8px 0 6px;padding-left:18px}
  .ad .ben{font-size:.85rem;color:var(--muted)}

  .hud{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0 12px;margin-bottom:6px}
  .hudtop{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .week{font-family:"Space Grotesk";font-weight:700;font-size:1.1rem}
  .progress{height:4px;background:var(--line);border-radius:4px;overflow:hidden;margin-bottom:10px}
  .progress i{display:block;height:100%;background:var(--accent);transition:width .5s}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .stat{font-size:.74rem;font-weight:600;color:var(--muted)}
  .stat .bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:4px}
  .stat .bar i{display:block;height:100%;border-radius:6px;transition:width .8s cubic-bezier(.3,.7,.3,1)}
  .drain{margin-top:8px;font-size:.78rem;color:var(--muted)}
  .drain b{color:var(--accent)}

  .promise{border-left:3px solid var(--accent);padding:6px 12px;background:var(--accent-soft);border-radius:0 10px 10px 0;font-size:.9rem}
  .promise b{display:block;font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--accent)}
  .echo{font-size:.85rem;font-weight:600;color:var(--violet);background:var(--violet-soft);border-radius:10px;padding:8px 12px}
  .teaser{font-size:.85rem;font-weight:600;color:var(--violet)}
  .warn{font-size:.85rem;font-weight:600;color:#b13a24;background:#fbe0dc;border-radius:10px;padding:8px 12px}
  .scene h2{font-size:1.5rem}
  .who{display:flex;gap:12px;align-items:flex-start}
  .who svg{flex:0 0 52px;width:52px;height:52px}
  .who .nm{font-size:.75rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
  .bubble{background:#fff;border:1px solid var(--line);border-radius:4px 14px 14px 14px;padding:10px 12px;margin-top:2px}

  .deltas{display:flex;flex-wrap:wrap;gap:6px}
  .d{font-size:.8rem;font-weight:600;padding:3px 9px;border-radius:999px;background:#eee;animation:pop .4s ease both}
  .d:nth-child(2){animation-delay:.08s}.d:nth-child(3){animation-delay:.16s}.d:nth-child(4){animation-delay:.24s}.d:nth-child(5){animation-delay:.32s}
  .d.up{background:#dff3e9;color:#1d7a4f}
  .d.down{background:#fbe0dc;color:#b13a24}
  .dw{font-weight:400;opacity:.8}
  @keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
  .event{border:1.5px dashed var(--ink);border-radius:14px;padding:12px 14px;background:#fffbe9;animation:pop .4s .3s ease both}
  .event b{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em}
  details.concept{border:1.5px solid var(--ink);border-radius:14px;padding:12px 16px;background:#fff}
  details.concept summary{cursor:pointer;list-style:none;font-family:"Space Grotesk";font-weight:700}
  details.concept summary::-webkit-details-marker{display:none}
  details.concept summary::after{content:" ▾";color:var(--muted)}
  .src{font-size:.78rem;color:var(--muted)}

  .big{font-family:"Space Grotesk";font-weight:700;font-size:1.9rem;letter-spacing:-.01em}
  .meter{display:grid;grid-template-columns:110px 1fr 40px;align-items:center;gap:8px;font-size:.85rem}
  .meter .bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden}
  .meter .bar i{display:block;height:100%;background:var(--ink)}
  .meter.me .bar i{background:var(--accent)} .meter.me span{font-weight:700}
  .plist{margin:0;padding-left:18px}
  .plist2,.why{margin:0;padding:0;list-style:none}
  .plist2 li,.why li{padding:6px 0;border-bottom:1px solid var(--line);font-size:.92rem}
  .plist2 li:last-child,.why li:last-child{border-bottom:0}
  .why li::before{content:"→ ";color:var(--accent);font-weight:700}
  .q{background:var(--ink);color:#fff;border-radius:14px;padding:16px}
  .q b{color:#ffb79f}

  .gallery{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
  .tile{aspect-ratio:1;border-radius:10px;background:#fff;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:1.4rem;position:relative}
  .tile.no{background:#ebe6dc;color:#b3ab9e;font-size:1rem;font-weight:700}
  .tile.me{outline:2.5px solid var(--accent)}
  .tile:hover .tt{display:block}
  .tt{display:none;position:absolute;bottom:105%;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:.72rem;padding:4px 8px;border-radius:6px;white-space:nowrap;z-index:3}

  .fade{animation:fade .35s ease}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .shake{animation:shake .5s ease}
  @keyframes shake{0%,100%{transform:none}20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
  #flash{position:fixed;inset:0;pointer-events:none;z-index:50;opacity:0}
  #flash.bad{animation:flash .6s ease;background:radial-gradient(circle,rgba(226,85,43,0) 40%,rgba(226,85,43,.45))}
  #flash.good{animation:flash .6s ease;background:radial-gradient(circle,rgba(47,158,106,0) 40%,rgba(47,158,106,.4))}
  @keyframes flash{0%{opacity:0}30%{opacity:1}100%{opacity:0}}
  .confetti{position:fixed;top:-12px;width:9px;height:14px;z-index:60;pointer-events:none;animation:fall linear forwards}
  @keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
  .bigicon{font-size:3.2rem;line-height:1;display:inline-block;animation:bounce .8s ease}
  @keyframes bounce{0%{transform:scale(.2)}60%{transform:scale(1.2)}100%{transform:scale(1)}}

  #mute{position:fixed;right:12px;bottom:12px;z-index:40;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);font-size:1.2rem;box-shadow:0 2px 8px rgba(0,0,0,.08)}
  footer{text-align:center;font-size:.75rem;color:var(--muted);margin-top:24px}
  .kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
  .kpi b{display:block;font-family:"Space Grotesk";font-size:1.5rem}
  .kpi span{font-size:.72rem;color:var(--muted);line-height:1.2;display:block}
  .sbox h3{font-size:1rem;margin-bottom:8px}
  .donutbox{display:flex;align-items:center;gap:14px}
  .donut{width:110px;height:110px;flex:0 0 110px;transform:rotate(0deg)}
  .legend{font-size:.84rem}
  .legend div{margin:3px 0}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
  .hbar{display:grid;grid-template-columns:1fr 90px 26px;align-items:center;gap:8px;font-size:.84rem;margin:5px 0}
  .hbar .bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden}
  .hbar .bar i{display:block;height:100%;background:var(--ink);transition:width .9s cubic-bezier(.3,.7,.3,1)}
  .hbar.me span{font-weight:700} .hbar.me .bar i{background:var(--accent)}
</style>
</head>

<div id="flash"></div>

<script>

const WHO = () => ({ boss:`${F().boss} · ${F().bossT}`, tomas:"Tomáš · kolega", eliska:"Eliška · taky nováčka", petra:"Petra · HR", jana:"Jana · kolegyně", kamarad:"Ondra · kamarád" });

/* ================= TÝDNY =================
 choice: t, fx{e,d,v,b}, c{aff,calc,norm}, set[], p{promise}, log[tag,text], res,
         need (min. energie), needD (min. důvěra), echo, lock:"nápověda", end         */
const L = (t,hint) => ({ t, lock:hint });

const WEEKS = [
 // 1
 S => ({ p:"onboard", title:"První den", who:null,
   text:`Tvůj buddy je na dovolené. ${cap(F().gear)} nemáš. Nikdo neví, kde budeš sedět.`,

   ],

 // 2
 S => ({ p:"onboard", title:"Tři lidé, tři úkoly", who:"boss",

    {t:"Vyberu si sám(a)", fx:{v:-10,b:-1}, log:["boss","2. týden: rozhodl(a) ses sám/sama, kolegové se urazili."], res:"Dva kolegové i šéf jsou naštvaní."},
    S.f.tomas
      ? {t:"Zeptám se Tomáše", fx:{v:5}, set:["rules"], echo:1, log:["links","2. týden: Tomáš ti vysvětlil nepsaná pravidla."], res:"Tomáš ti prozradí nepsaná pravidla firmy.", who:"tomas"}
      : L("Zeptám se zkušeného kolegy","Odemkneš, když si v 1. týdnu najdeš spojence mezi kolegy.")
   ],
   concept:["Srozumitelnost role","Nejasná role je jeden z nejsilnějších stresorů.","Bauer et al., 2007"] }),

 // 3
 S => { const wh = S.f.workhorse; return { p:"balance", title:`${F().chan} ve 21:47`, who:"boss",

 // 4

const clamp = x => Math.max(0, Math.min(100, x));
const $app = document.getElementById("app");
function render(html, cls=""){
  $app.innerHTML = `<div class="fade ${cls}">${html}</div><footer>3PS212 Organizační chování · VŠE</footer>`;
  window.scrollTo(0,0);
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    document.querySelectorAll("[data-w]").forEach(el => el.style.width = el.dataset.w + "%");
  }));
}
function store(k, v){ try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k, v); }catch(e){ return null; } }
function found(){ try{ return JSON.parse(store("90dni-konce")||"[]"); }catch(e){ return []; } }
function saveFound(id){ const f=found(); if(!f.includes(id)){ f.push(id); store("90dni-konce", JSON.stringify(f)); } }

/* ================= ZVUK ================= */
let muted = store("90dni-mute")==="1", AC = null;
document.getElementById("mute").textContent = muted ? "🔇" : "🔊";
function toggleMute(){ muted = !muted; store("90dni-mute", muted?"1":"0"); document.getElementById("mute").textContent = muted ? "🔇" : "🔊"; if(!muted) sfx("click"); }
function tone(f, start, dur, type="sine", vol=.12){
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.value = f; o.connect(g); g.connect(AC.destination);
  const t = AC.currentTime + start;
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t+.01); g.gain.exponentialRampToValueAtTime(.0001, t+dur);
  o.start(t); o.stop(t+dur+.02);
}
function sfx(kind){
  if(muted) return;
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==="suspended") AC.resume();
    ({
      click:()=>tone(660,0,.06,"triangle",.08),
      good:()=>{tone(523,0,.12);tone(784,.09,.18);},
      bad:()=>{tone(220,0,.18,"sawtooth",.06);tone(165,.12,.25,"sawtooth",.06);},
      event:()=>{tone(880,0,.1,"square",.05);tone(1175,.1,.15,"square",.05);},
      win:()=>[523,659,784,1047].forEach((f,i)=>tone(f,i*.11,.3,"triangle",.1)),
      lose:()=>[392,330,262,196].forEach((f,i)=>tone(f,i*.15,.35,"sawtooth",.05)),
      mid:()=>{tone(440,0,.2,"triangle");tone(554,.15,.3,"triangle");}
    })[kind]();
  }catch(e){}
}
function flash(kind){ const el=document.getElementById("flash"); el.className=""; void el.offsetWidth; el.className=kind; }
function confetti(){
  const cols=["#e2552b","#2f9e6a","#3a6fd8","#c69a1e","#5b3fb5"];
  for(let i=0;i<60;i++){
    const c=document.createElement("div"); c.className="confetti";
    c.style.left=Math.random()*100+"vw"; c.style.background=cols[i%cols.length];
    c.style.animationDuration=(1.8+Math.random()*1.6)+"s"; c.style.animationDelay=(Math.random()*.4)+"s";
    document.body.appendChild(c); setTimeout(()=>c.remove(),4000);
  }
}

/* ================= SDÍLENÉ VÝSLEDKY ================= */
async function sendResult(id){
  if(!RESULTS_URL) return;
  const today = new Date().toISOString().slice(0,10);
  if(store("90dni-odeslano")===today) return;       // každý hráč se počítá jen jednou za den (první hra)
  try{
    await fetch(`${RESULTS_URL}?action=add&end=${id}&firm=${F().id}`);
    store("90dni-odeslano", today);
  }catch(e){}
}
async function getStats(){
  if(!RESULTS_URL) return null;
  try{ const r = await fetch(`${RESULTS_URL}?action=stats`); return await r.json(); }catch(e){ return null; }
}
const GROUP = {
  stay:["happy","golden","duty","favorite","quiet","change"],
  left:["runEarly","runMid","leave","offer","tomas","together"],
  out:["sacrifice","empty","fired"]
};
function donut(parts){
  // parts: [{n, col, label}]
  const tot = parts.reduce((a,p)=>a+p.n,0) || 1, R = 15.915;
  let off = 25, arcs = "";
  parts.forEach(p=>{ const pct = p.n/tot*100; if(pct>0){ arcs += `<circle cx="21" cy="21" r="${R}" fill="none" stroke="${p.col}" stroke-width="6" stroke-dasharray="${pct} ${100-pct}" stroke-dashoffset="${off}"/>`; off -= pct; } });
  return `<div class="donutbox"><svg viewBox="0 0 42 42" class="donut"><circle cx="21" cy="21" r="${R}" fill="none" stroke="#e3ddd1" stroke-width="6"/>${arcs}</svg>
    <div class="legend">${parts.map(p=>`<div><i style="background:${p.col}"></i>${p.label} <b>${Math.round(p.n/tot*100)} %</b> <span class="muted">(${p.n})</span></div>`).join("")}</div></div>`;
}
function statsHTML(st, mine){
  if(!RESULTS_URL) return `<p class="small muted" style="margin:0">Výsledky třídy zatím nejsou zapojené.</p>`;
  if(!st) return `<p class="small muted" style="margin:0">Výsledky se nepodařilo načíst. Zkus to za chvíli.</p>`;
  const C = st.counts || {}, tot = Object.entries(C).filter(([k])=>ENDINGS[k]).reduce((a,[,n])=>a+n,0);
  if(!tot) return `<p class="small muted" style="margin:0">Zatím nikdo nedohrál. Buď první!</p>`;
  const sum = ids => ids.reduce((a,k)=>a+(C[k]||0),0);
  const rows = Object.entries(C).filter(([k])=>ENDINGS[k]).sort((a,b)=>b[1]-a[1]);
  const max = rows[0][1], topId = rows[0][0];
  const pct = n => Math.round(n/tot*100);
  return `
    <div class="kpis">
      <div class="kpi"><b>${tot}</b><span>dohraných her</span></div>
      <div class="kpi"><b>${pct(sum(GROUP.stay))} %</b><span>zůstalo ve firmě</span></div>
      <div class="kpi"><b>${pct(C.golden||0)} %</b><span>ve zlatých poutech</span></div>
    </div>

    <div class="sbox"><h3>Jak zkušebka dopadla</h3>
    ${donut([
      {n:sum(GROUP.stay), col:"#2f9e6a", label:"Zůstali"},
      {n:sum(GROUP.left), col:"#3a6fd8", label:"Odešli sami"},
      {n:sum(GROUP.out), col:"#e2552b", label:"Vyčerpání / vyhozeni"}
    ])}</div>

    <div class="sbox"><h3>Co drželo ty, kdo zůstali</h3>
    ${sum(GROUP.stay) ? donut([
      {n:(C.happy||0)+(C.change||0), col:"#2f9e6a", label:"Chtěli (afektivní)"},
      {n:(C.golden||0)+(C.quiet||0), col:"#c69a1e", label:"Benefity (kalkulativní)"},
      {n:(C.duty||0)+(C.favorite||0), col:"#5b3fb5", label:"Povinnost / šéf (normativní)"}
    ]) : `<p class="small muted" style="margin:0">Zatím nikdo nezůstal.</p>`}</div>

    <div class="sbox"><h3>Všechny konce</h3>
    ${rows.map(([k,n])=>`<div class="hbar ${k===mine?'me':''}"><span>${ENDINGS[k].ic} ${ENDINGS[k].t}</span><div class="bar"><i data-w="${Math.round(n/max*100)}" style="width:0"></i></div><b>${n}</b></div>`).join("")}
    </div>

    <div class="q"><b>Nejčastější konec třídy: ${ENDINGS[topId].ic} ${ENDINGS[topId].t}.</b><br>${ENDINGS[topId].q}</div>`;
}
async function fillStats(mine){
  const box = document.getElementById("stats"); if(!box) return;
  const st = await getStats();
  if(!document.getElementById("stats")) return;
  box.innerHTML = statsHTML(st, mine);
  requestAnimationFrame(()=>requestAnimationFrame(()=>box.querySelectorAll("[data-w]").forEach(el=>el.style.width=el.dataset.w+"%")));
}
let statsTimer = null;
function classScreen(){
  render(`<div class="card stack"><h2>📊 Výsledky třídy</h2>
    <p class="small muted" style="margin:0">Hry za posledních 12 hodin · obnovuje se samo každých 15 s</p>
    <div id="stats" class="stack"><p class="muted small">Načítám…</p></div>
    <button class="btn primary" onclick="clearInterval(statsTimer);intro()">Zpět</button></div>`);
  fillStats(null);
  clearInterval(statsTimer);
  statsTimer = setInterval(()=>{ if(document.getElementById("stats")) fillStats(null); else clearInterval(statsTimer); }, 15000);
}

/* ================= OBRAZOVKY ================= */
function gallery(me){
  const f = found();
  return `<div class="gallery">${ENDING_IDS.map(id=>{
    const ok = f.includes(id);
    return `<div class="tile ${ok?'':'no'} ${id===me?'me':''}">${ok?ENDINGS[id].ic:'?'}<span class="tt">${ok?ENDINGS[id].t:'Neobjeveno'}</span></div>`;
  }).join("")}</div>`;
}

function intro(){
  reset();
  const n = found().length;
  render(`
  <div class="stack">
    <div class="card hero stack">
      <span class="tag">Hra k prezentaci</span>
      <h1>90 <span>dní</span></h1>
      <p style="font-size:1.1rem;margin:4px 0 0">Přežiješ zkušební dobu?</p>
      <p class="muted" style="margin:0">12 týdnů, 12 rozhodnutí. Firma si je pamatuje.</p>
      <button class="btn primary" onclick="sfx('click');pickFirm()">Začít →</button>
    </div>
    <div class="card stack">
      <h3>Konce: ${n} / ${ENDING_IDS.length}</h3>
      ${gallery()}
    </div>
    ${RESULTS_URL ? `<button class="btn ghost" onclick="sfx('click');classScreen()">📊 Výsledky třídy</button>` : ""}
  </div>`);
}


function pickFirm(){
  render(`
  <div class="stack">
    <h2>Vyber si inzerát</h2>
    ${FIRMS.map((f,i)=>`
      <button class="ad" onclick="sfx('good');start(${i})">
        <div class="firm">${f.name} <span class="muted small" style="font-family:Inter;font-weight:400">· ${f.kind}</span></div>
        <div class="small muted">hledá: ${f.role}</div>
        <ul>${Object.values(f.promises).map(p=>`<li>${p}</li>`).join("")}</ul>
        <div class="ben">🎁 Po zkušebce: ${f.benefits}</div>
      </button>`).join("")}
    <p class="small muted" style="margin:0">Sliby z inzerátu jsou tvoje psychologická smlouva. Uvidíme, kolik jich platí.</p>
  </div>`);
}
function start(i){ S.firm = FIRMS[i]; addConcept("Psychologická smlouva"); scene(); }
function addConcept(n){ if(!S.concepts.includes(n)) S.concepts.push(n); }

function weeklyDrain(){
  let x = 3, why = [];
  if(S.f.alwayson){ x += 2; why.push("zprávy večer"); }
  if(S.f.workhorse){ x += 2; why.push("práce navíc"); }
  if(S.f.insecure){ x += 2; why.push("nejistota"); }
  if(S.f.lonely){ x += 2; why.push("samota"); }
  if(S.v >= 40){ x -= 2; why.push("kolegové pomáhají"); }
  if(S.f.favorite || S.f.duo){ x -= 2; why.push("home office"); }
  return { x: Math.max(1,x), why };
}
const bossFace = () => S.b >= 3 ? "😀" : S.b >= 1 ? "🙂" : S.b > -2 ? "😐" : S.b > -4 ? "😠" : "🤬";

function hud(shown){
  const bar = (k,col) => `<div class="stat">${LABELS[k]}<div class="bar"><i data-w="${S[k]}" style="width:${S.pv[k]}%;background:${col}"></i></div></div>`;
  const dr = weeklyDrain();
  const out = `
  <div class="hud">
    <div class="hudtop"><div class="week">Týden ${shown} / 12</div><div class="small">${F().name} · šéf ${bossFace()}</div></div>
    <div class="progress"><i style="width:${(S.i/12)*100}%"></i></div>
    <div class="stats">${bar("e","var(--energy)")}${bar("d","var(--trust)")}${bar("v","var(--links)")}</div>
    <div class="drain">⚡ Práce ti každý týden ubere <b>−${dr.x}</b> energie</div>
  </div>`;
  S.pv = {e:S.e, d:S.d, v:S.v};
  return out;
}

function whoBlock(id, text){
  if(!id) return `<p style="margin:0">${text}</p>`;
  return `<div class="who">${avatar(id)}<div><div class="nm">${WHO()[id]}</div><div class="bubble">${text}</div></div></div>`;
}

function scene(){
  cur = WEEKS[S.i](S);
  const promise = cur.p==="benefit"
      ? `<div class="promise"><b>Inzerát</b>🎁 ${F().benefits}</div>`
      : `<div class="promise"><b>Inzerát slíbil</b>${F().promises[cur.p]}</div>`;
  render(`${hud(S.i+1)}
  <div class="card scene stack">
    ${promise}
    ${cur.echo ? `<div class="echo">🔁 ${cur.echo}</div>` : ""}
    <h2>${cur.title}</h2>
    ${whoBlock(cur.who, cur.text)}
    <div class="choices">
      ${cur.choices.map((c,j)=>{
        if(c.lock) return `<button class="btn locked" disabled>🔒 ${c.t}<span class="lock">${c.lock}</span></button>`;
        const tired = c.need && S.e < c.need, doubt = c.needD && S.d < c.needD;
        if(tired || doubt) return `<button class="btn locked tired" disabled>${c.t}<span class="lock">${tired?"Nemáš na to sílu":"Tomu sám/sama nevěříš"}</span></button>`;
        return `<button class="btn ${c.echo?'btn-echo':''}" onclick="choose(${j})">${c.echo?'🔁 ':''}${c.t}</button>`;
      }).join("")}
    </div>
  </div>
  ${S.i < 11 ? `<div style="margin-top:14px"><button class="btn ghost" onclick="sfx('click');quitConfirm()">Dát výpověď hned</button></div>` : ""}`);
}

function applyFx(fx, c, chips){
  let sum = 0;
  for(const k of ["e","d","v"]){
    const dv = (fx||{})[k]||0;
    if(dv){ S[k] = clamp(S[k]+dv); sum += dv; chips.push(`<span class="d ${dv>0?'up':'down'}">${LABELS[k]} ${dv>0?'+':'−'}${Math.abs(dv)}</span>`); }
  }
  if(fx && fx.b){ S.b += fx.b; chips.push(`<span class="d ${fx.b>0?'up':'down'}">Šéf ${fx.b>0?'👍':'👎'}</span>`); }
  if(c) for(const k in c) S[k] += c[k];
  return sum;
}

function choose(j){
  const c = cur.choices[j], week = S.i+1;
  addConcept(cur.concept[0]);
  if(c.end){ S.i++; return finish(c.end); }

  const chips = [];
  let sum = applyFx(c.fx, c.c, chips);
  if(c.p) Object.assign(S.prom, c.p);
  const newFlag = (c.set||[]).some(f => !S.f[f]);
  (c.set||[]).forEach(f => S.f[f] = true);
  if(c.log) S.log.push(c.log);
  if(cur.after) cur.after(S);

  // týdenní zátěž (JD-R)
  const dr = weeklyDrain();
  S.e = clamp(S.e - dr.x);
  chips.push(`<span class="d down">Týden v práci −${dr.x}${dr.why.length?` <span class="dw">(${dr.why.join(", ")})</span>`:""}</span>`);

  // náhodná událost
  let evHTML = "";
  if(week >= 2 && week <= 10 && Math.random() < 0.35){
    const pool = EVENTS.filter(e => !S.ev.includes(e.id) && (!e.cond || e.cond(S)));
    if(pool.length){
      const ev = pool[Math.floor(Math.random()*pool.length)];
      S.ev.push(ev.id);
      const ech = []; sum += applyFx(ev.fx, ev.c, ech);
      if(ev.c && ev.c.calc) ech.push(`<span class="d">Benefity táhnou</span>`);
      evHTML = `<div class="event"><b>📰 Událost týdne</b><div style="margin:4px 0 8px">${ev.ic} ${ev.t}</div><div class="deltas">${ech.join("")}</div></div>`;
    }
  }
  S.i++;

  let next = `<button class="btn primary" onclick="sfx('click');scene()">Týden ${S.i+1} →</button>`;
  if(S.e <= 0) next = `<button class="btn primary" onclick="finish('energy')">Dál →</button>`;
  else if(S.b <= -4 && week >= 6) next = `<button class="btn primary" onclick="finish('fired')">Šéf si tě volá… →</button>`;

  render(`${hud(week)}
  <div class="card stack">
    ${whoBlock(c.who, `<span style="font-size:1.1rem;font-weight:500">${c.res}</span>`)}
    <div class="deltas">${chips.join("")}</div>
    ${newFlag ? `<div class="teaser">🔁 Tohle se ti ještě vrátí.</div>` : ""}
    ${evHTML}
    ${S.e>0 && S.e < 20 ? `<div class="warn">⚠️ Jsi na dně. Další týden to nemusíš dát.</div>` : ""}
    <details class="concept">
      <summary>💡 ${cur.concept[0]}</summary>
      <p class="small" style="margin:6px 0 2px">${cur.concept[1]}</p>
      <div class="src">${cur.concept[2]}</div>
    </details>
    ${next}
  </div>`);
  const total = sum - dr.x;
  if(total <= -15 || S.e < 20){ flash("bad"); sfx("bad"); }
  else if(total >= 10){ flash("good"); sfx("good"); }
  else sfx(evHTML ? "event" : "click");
}

function quitConfirm(){
  render(`${hud(S.i+1)}
  <div class="card stack">
    <h2>Opravdu odejít?</h2>
    <p style="margin:0">Ve zkušebce můžeš odejít kdykoli i bez důvodu. Benefity ale propadnou.</p>
    <button class="btn primary" onclick="finish('quit')">Odcházím</button>
    <button class="btn" style="text-align:center" onclick="sfx('click');scene()">Ještě vydržím</button>
  </div>`);
}

/* ================= VYHODNOCENÍ ================= */
function commit(){
  const aff = Math.max(0, S.aff*1.5 + (S.d + S.v - 80)/25);
  const calc = Math.max(0, S.calc*1.5 + S.i/6);
  const norm = Math.max(0, S.norm*1.5);
  const tot = aff+calc+norm || 1;
  return { aff:Math.round(aff/tot*100), calc:Math.round(calc/tot*100), norm:Math.round(norm/tot*100) };
}

function pickEnding(kind){
  if(kind==="energy") return (S.f.workhorse || S.f.alwayson) ? "sacrifice" : "empty";
  if(["fired","leave","offer","tomas","quiet","together"].includes(kind)) return kind;
  if(kind==="quit") return S.i <= 5 ? "runEarly" : "runMid";
  // zůstává
  if(S.f.changeAgent) return "change";
  if(S.b >= 4 && (S.f.workhorse || S.f.alwayson)) return "favorite";
  const c = commit();
  const top = Object.keys(c).sort((a,b)=>c[b]-c[a])[0];
  if(top==="aff") return S.d >= 45 ? "happy" : "golden";
  return top==="calc" ? "golden" : "duty";
}

function finish(kind){
  const id = pickEnding(kind), E = ENDINGS[id];
  const isNew = !found().includes(id);
  saveFound(id);
  sendResult(id);

  let why = S.log.filter(l => E.tags.includes(l[0])).map(l=>l[1]);
  if(why.length < 2) why = why.concat(S.log.filter(l => !E.tags.includes(l[0])).map(l=>l[1]).slice(-(2-why.length)));
  why = why.slice(-3);

  let epi = "";
  if(["happy","golden","duty","favorite","quiet","change"].includes(id)){
    if(S.f.changeAgent) epi = "📅 Leden: nový onboarding je venku. Další nováček má buddyho, který má čas.";
    else if(S.f.written) epi = "📅 Leden: home office opravdu přišel. Písemný závazek zafungoval.";
    else if(S.f.believe) epi = "📅 Leden: home office nepřišel. Další nenaplněný slib.";
    else epi = "📅 Leden: nic se nezměnilo.";
  }

  const P = F().promises;
  const kept = Object.keys(P).filter(k=>S.prom[k]==="kept").length;
  const plist = Object.keys(P).map(k=>{ const st=S.prom[k]; return `<li>${st==="kept"?"✅":st==="broken"?"❌":"➖"} ${P[k]}</li>`; }).join("");
  const c = commit();
  const meter = k => `<div class="meter"><span>${{aff:"Afektivní",calc:"Kalkulativní",norm:"Normativní"}[k]}</span><div class="bar"><i data-w="${c[k]}" style="width:0"></i></div><b>${c[k]}%</b></div>`;

  render(`<div class="stack">
    <div class="card stack" style="text-align:center">
      <div><span class="bigicon">${E.ic}</span></div>
      ${isNew ? `<div><span class="tag">Nový konec!</span></div>` : ""}
      <div class="big">${E.t}</div>
      <p style="margin:0" class="muted">${E.s}</p>
    </div>

    <div class="card stack">
      <h3>Proč se to stalo</h3>
      <ul class="why">${why.map(w=>`<li>${w}</li>`).join("")}</ul>
      <p class="small" style="margin:0"><b>💡 Teorie:</b> ${E.th}</p>
      ${epi ? `<p style="margin:0">${epi}</p>` : ""}
    </div>

    <div class="q"><b>Otázka do diskuse:</b> ${E.q}</div>

    ${RESULTS_URL ? `<div class="card stack"><h3>📊 Jak dopadla třída</h3><div id="stats" class="stack"><p class="muted small">Načítám…</p></div></div>` : ""}

    <div class="card stack">
      <h3>Sliby ${F().name}: ${kept} z 5 dodrženo</h3>
      <ul class="plist2">${plist}</ul>
    </div>

    <div class="card stack">
      <h3>Co tě drželo</h3>
      ${meter("aff")}${meter("calc")}${meter("norm")}
      <div class="small muted">Meyer & Allen, 1991</div>
    </div>

    <div class="card stack">
      <h3>Tvoje konce: ${found().length} / ${ENDING_IDS.length}</h3>
      ${gallery(id)}
    </div>

    <button class="btn primary" onclick="sfx('click');intro()">Hrát znovu – najdi jiný konec</button>
  </div>`, E.mood==="bad" ? "shake" : "");

  if(E.mood==="good"){ sfx("win"); confetti(); }
  else if(E.mood==="bad"){ sfx("lose"); flash("bad"); }
  else sfx("mid");
  if(RESULTS_URL) setTimeout(()=>fillStats(id), 1200);
}

intro();
</script>
